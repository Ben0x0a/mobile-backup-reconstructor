# Continuous integration: lint, format check and tests on every push and PR.
#
# Actions are pinned to full commit SHAs rather than movable tags: a tag can be
# re-pointed by a compromised maintainer at code that runs with this repository's
# token. Dependabot bumps the SHAs and records the new version in the comment.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, so CI runs
      # exactly the dependency versions the lockfile records.
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # PySide6 needs these shared libraries even under the offscreen platform,
      # which is what lets the GUI tests run without a display server.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check .

      - name: Check formatting
        run: uvx ruff format --check .
