[project]
name = "mobile-backup-reconstructor"
dynamic = ["version"]
description = "Reconstruct iOS and Android backups into a Full File System-like zip, decrypting when needed, with forensic traceability output."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42",
    "pyside6>=6.6",
]

[project.scripts]
mobile-backup-reconstruct = "launcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: config/settings.py TOOL_VERSION,
# which is also what every traceability artefact records.
[tool.hatch.version]
path = "config/settings.py"
pattern = "TOOL_VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["config", "core", "gui", "launcher"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "G"]

[tool.pytest.ini_options]
testpaths = ["tests"]
